description=Syncs the AwesomeClan roster to the clan website and can show your XP, boss kills and clue counts live on the dashboard. Also sends clan kick, recruit and coffer broadcasts, the coffer balance when you open it, and a hashed account ID used to spot name changes. If you turn on the clan chat relay, it also sends your clan's chat messages and clan broadcasts. Checks the clan website for clan notifications to show in game. Does nothing until you add a token from the dashboard.
